<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Event Helper Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <!-- Top Navigation -->
  <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-indigo-400">Server Event Manager</h1>
    
    <!-- User / Auth Profile Area -->
    <div id="auth-area" class="flex items-center space-x-3">
      <button id="login-btn" onclick="handleDiscordLogin()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded-lg flex items-center space-x-2 transition">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        <span>Login with Discord</span>
      </button>
    </div>
  </nav>

  <!-- Main Dashboard -->
  <main class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">Upcoming Events</h2>
      <button id="open-modal-btn" onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium shadow-md transition">
        + Create Event
      </button>
    </div>

    <!-- Event Cards Container -->
    <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-slate-400">Loading events...</p>
    </div>
  </main>

  <!-- Create Event Modal -->
  <div id="event-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md shadow-2xl">
      <h3 class="text-xl font-bold mb-4">Create New Event</h3>
      
      <form id="create-event-form" onsubmit="handleCreateEvent(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Event Title</label>
          <input type="text" id="event-title" required placeholder="e.g., Movie Night" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Date & Time</label>
          <input type="datetime-local" id="event-time" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Description</label>
          <textarea id="event-desc" rows="3" required placeholder="Brief description..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-2">
          <button type="button" onclick="toggleModal(false)" class="px-4 py-2 rounded-lg text-sm text-slate-400 hover:text-white transition">Cancel</button>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-semibold text-white transition">Create Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Upcoming Schedule Picker Modal -->
  <div id="schedule-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50">
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-sm text-white shadow-2xl">
      <h3 class="text-lg font-bold mb-3">Set Event Schedule</h3>
      
      <label class="block text-xs text-slate-400 mb-1">When will this event happen?</label>
      <input type="datetime-local" id="event-datetime-input" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-indigo-500 mb-4">

      <input type="hidden" id="target-event-id">

      <div class="flex justify-end gap-2">
        <button onclick="closeScheduleModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">Cancel</button>
        <button onclick="saveScheduledTime()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded text-xs font-semibold">Save Schedule</button>
      </div>
    </div>
  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    window.DB_URL = 'https://toxrqbcgtmkgvmauqbej.supabase.co';
    window.DB_KEY = 'YOUR_ANON_PUBLIC_KEY_HERE';

    let currentUser = 'Staff Member';

    if (window.supabase) {
      window.sbClient = window.supabase.createClient(window.DB_URL, window.DB_KEY);

      // Restore user session if returning from Discord OAuth
      window.sbClient.auth.onAuthStateChange((event, session) => {
        if (session?.user) {
          currentUser = session.user.user_metadata.full_name || session.user.user_metadata.custom_claims?.global_name || session.user.email;
          renderUserProfile(session.user);
        }
      });

      // Fetch Events
      async function loadEvents() {
        const { data: events, error } = await window.sbClient
          .from('team_data')
          .select('*')
          .eq('is_completed', false)
          .order('created_at', { ascending: false });

        if (error) {
          console.error('Error fetching events:', error);
          return;
        }

        renderEventsGrid(events);
      }

      function renderEventsGrid(events) {
        const grid = document.getElementById('events-grid');
        if (!grid) return;

        if (!events || events.length === 0) {
          grid.innerHTML = `<p class="text-slate-500 italic col-span-full">No active events found.</p>`;
          return;
        }

        grid.innerHTML = '';
        events.forEach(event => {
          const status = event.status || (event.scheduled_at ? 'Upcoming' : 'Draft');
          const timeText = event.scheduled_at 
            ? new Date(event.scheduled_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) 
            : 'Unscheduled';

          const badgeColor = status === 'Live now' ? 'bg-red-900/60 text-red-400 border-red-700' :
                             status === 'Upcoming' ? 'bg-indigo-900/60 text-indigo-400 border-indigo-700' :
                             'bg-slate-700 text-slate-300 border-slate-600';

          const card = document.createElement('div');
          card.className = 'bg-slate-800 border border-slate-700 rounded-xl p-5 hover:border-indigo-500 transition flex flex-col justify-between';
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-3">
                <span class="text-xs font-semibold px-2 py-0.5 rounded border ${badgeColor}">
                  ${status === 'Live now' ? '🔴 Live now' : status}
                </span>
                <span class="text-xs text-slate-400">📅 ${timeText}</span>
              </div>
              <h3 class="text-lg font-semibold mb-2 text-white">${event.title || 'Untitled Event'}</h3>
              <p class="text-sm text-slate-400 mb-4">${event.content || ''}</p>
            </div>
            
            <div class="border-t border-slate-700 pt-3 flex flex-col gap-3">
              <div class="flex justify-between items-center text-xs">
                <span class="text-slate-400">Status:</span>
                <select onchange="handleStatusChange('${event.id}', this.value)" class="bg-slate-900 border border-slate-700 text-xs rounded px-2 py-1 text-slate-200">
                  <option value="Draft" ${status === 'Draft' ? 'selected' : ''}>Draft</option>
                  <option value="Upcoming" ${status === 'Upcoming' ? 'selected' : ''}>Upcoming</option>
                  <option value="Live now" ${status === 'Live now' ? 'selected' : ''}>Live now</option>
                </select>
              </div>

              <div class="flex justify-between items-center pt-1 border-t border-slate-700/50">
                <span class="text-xs text-slate-500">${event.updated_by ? 'By: ' + event.updated_by : ''}</span>
                <button onclick="markComplete('${event.id}')" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded transition font-medium">
                  ✓ Done
                </button>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      // Status Dropdown Handling
      window.handleStatusChange = function(eventId, selectedStatus) {
        if (selectedStatus === 'Upcoming') {
          document.getElementById('target-event-id').value = eventId;
          document.getElementById('schedule-modal').classList.remove('hidden');
        } else {
          updateEventStatus(eventId, selectedStatus, null);
        }
      };

      window.closeScheduleModal = function() {
        document.getElementById('schedule-modal').classList.add('hidden');
        document.getElementById('target-event-id').value = '';
        document.getElementById('event-datetime-input').value = '';
      };

      window.saveScheduledTime = async function() {
        const eventId = document.getElementById('target-event-id').value;
        const rawTime = document.getElementById('event-datetime-input').value;

        if (!rawTime) {
          alert("Please select a date and time.");
          return;
        }

        const scheduledIso = new Date(rawTime).toISOString();
        await updateEventStatus(eventId, 'Upcoming', scheduledIso);
        closeScheduleModal();
      };

      async function updateEventStatus(eventId, status, scheduledAt = null) {
        const payload = { status: status, updated_by: currentUser };
        if (scheduledAt) payload.scheduled_at = scheduledAt;

        const { error } = await window.sbClient
          .from('team_data')
          .update(payload)
          .eq('id', eventId);

        if (error) {
          console.error("Error updating status:", error);
        } else {
          loadEvents();
        }
      }

      // Create Event
      window.handleCreateEvent = async function(e) {
        e.preventDefault();
        const title = document.getElementById('event-title').value;
        const rawTime = document.getElementById('event-time').value;
        const desc = document.getElementById('event-desc').value;

        const scheduledIso = rawTime ? new Date(rawTime).toISOString() : null;

        const { error } = await window.sbClient
          .from('team_data')
          .insert([{
            title: title,
            content: desc,
            scheduled_at: scheduledIso,
            status: 'Upcoming',
            is_completed: false,
            updated_by: currentUser
          }]);

        if (error) {
          console.error('Error creating event:', error);
        } else {
          toggleModal(false);
          loadEvents();
        }
      };

      // Mark Complete
      window.markComplete = async function(eventId) {
        const { error } = await window.sbClient
          .from('team_data')
          .update({ is_completed: true, updated_by: currentUser })
          .eq('id', eventId);

        if (error) {
          console.error('Error completing event:', error);
        } else {
          loadEvents();
        }
      };

      // Realtime Subscriptions
      window.sbClient
        .channel('public:team_data')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'team_data' }, () => {
          loadEvents();
        })
        .subscribe();

      // Auto-check for event start times every 30 seconds
      setInterval(async () => {
        const { data: events } = await window.sbClient
          .from('team_data')
          .select('*')
          .eq('status', 'Upcoming')
          .eq('is_completed', false);

        if (!events) return;

        const now = new Date();
        events.forEach(async (event) => {
          if (event.scheduled_at && new Date(event.scheduled_at) <= now) {
            await window.sbClient
              .from('team_data')
              .update({ status: 'Live now' })
              .eq('id', event.id);
          }
        });
      }, 30000);

      // Discord Login
      window.handleDiscordLogin = async function() {
        await window.sbClient.auth.signInWithOAuth({
          provider: 'discord',
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });
      };

      function renderUserProfile(user) {
        const authArea = document.getElementById('auth-area');
        const name = user.user_metadata.full_name || 'Discord Member';
        const avatar = user.user_metadata.avatar_url || 'https://cdn.discordapp.com/embed/avatars/0.png';

        authArea.innerHTML = `
          <div class="flex items-center space-x-3">
            <img src="${avatar}" alt="Avatar" class="w-9 h-9 rounded-full border border-indigo-500">
            <div>
              <p class="text-sm font-semibold">${name}</p>
              <span class="text-xs bg-indigo-900 text-indigo-300 px-2 py-0.5 rounded-full">Connected</span>
            </div>
          </div>
        `;
      }

      // Initial Load
      loadEvents();
    }

    function toggleModal(show) {
      const modal = document.getElementById('event-modal');
      if (show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
        document.getElementById('create-event-form').reset();
      }
    }
  </script>
</body>
</html>
