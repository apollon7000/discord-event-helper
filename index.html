<!DOCTYPE html>
<html lang="en" class="dark">
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Server Event Helpers</title>  
  <script src="https://cdn.tailwindcss.com"></script>  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
  <link rel="preconnect" href="https://fonts.googleapis.com">  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">  
  <link rel="icon" href="data:,">  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {        
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },         
          colors: {
            discord: {              
              blurple: '#5865F2',
              green: '#57F287',              
              yellow: '#FEE75C',
              fuchsia: '#EB459E',              
              red: '#ED4245',
              dark: '#313338',
              darker: '#2B2D31',              
              darkest: '#1E1F22',            
            }
          }
        }
      }
    }
  </script>  
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {      
      background: #1E1F22;
    }
    ::-webkit-scrollbar-thumb {      
      background: #3B3D44;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {      
      background: #4E5058;
    }
    .glass-card {
      background: rgba(43, 45, 49, 0.7);
      backdrop-filter: blur(12px);      
      border: 1px solid rgba(255, 255, 255, 0.08);
    }  
  </style>
</head>
<body class="bg-discord-darkest text-gray-200 font-sans min-h-screen flex flex-col antialiased">  
  <div id="app" class="flex-1 flex flex-col">
    <!-- Navbar -->    
    <header class="sticky top-0 z-30 glass-card border-b border-gray-800 px-4 lg:px-8 py-3.5 shadow-md">      
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center space-x-3">          
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-discord-blurple to-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">            
            <i class="fa-solid font-bold text-white text-xl">SE</i>
          </div>          
          <div>            
            <h1 class="font-bold text-lg leading-tight text-white tracking-wide">Server Event Helpers</h1>            
            <p class="text-xs text-gray-400">Community & Discord Event Suite</p>          
          </div>
        </div>        
        <div class="flex items-center space-x-3">          
          <button id="open-guide-btn" class="px-3.5 py-2 text-xs md:text-sm font-medium text-gray-300 hover:text-white bg-discord-darker hover:bg-gray-700/60 rounded-xl transition-all border border-gray-700/50 flex items-center space-x-2">            
            <i class="fa-solid font-normal text-discord-blurple">?</i>            
            <span class="hidden sm:inline">Setup Guide</span>          
          </button>         
          <button id="open-settings-btn" class="p-2.5 text-gray-300 hover:text-white bg-discord-darker hover:bg-gray-700/60 rounded-xl transition-all border border-gray-700/50" title="OAuth Settings">            
            <i class="fa-solid text-sm">⚙️</i>          
          </button>          
          <div id="auth-container" class="flex items-center"></div>        
        </div>      
      </div>    
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Left Sidebar: Event Creation Form -->      
      <section class="lg:col-span-5 flex flex-col space-y-6">
        <div class="glass-card rounded-2xl p-6 shadow-xl relative overflow-hidden">          
          <div class="absolute -top-10 -right-10 w-32 h-32 bg-discord-blurple/10 rounded-full blur-2xl pointer-events-none"></div>          
          <div class="flex items-center justify-between pb-4 border-b border-gray-800 mb-6">            
            <h2 class="text-lg font-bold text-white flex items-center space-x-2">              
              <i class="fa-solid text-discord-blurple">➕</i>              
              <span>Schedule New Event</span>            
            </h2>            
            <span class="text-xs bg-discord-blurple/20 text-discord-blurple font-semibold px-2.5 py-1 rounded-full border border-discord-blurple/30">              
              Quick Creator            
            </span>          
          </div>          
          <form id="event-form" class="space-y-5">            
            <div>              
              <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">                
                Event Title <span class="text-discord-red">*</span>              
              </label>              
              <input type="text" id="event-title" required placeholder="e.g., Community Game Night or Q&A Session"                
                class="w-full bg-discord-darkest border border-gray-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-discord-blurple focus:ring-1 focus:ring-discord-blurple transition-all">            
            </div>            
            <div>              
              <div class="flex items-center justify-between mb-1.5">                
                <label class="block text-xs font-semibold uppercase tracking-wider text-blue-400">                  
                  Hosts <span class="text-discord-red">*</span>                
                </label>                
                <span class="text-[11px] text-gray-500">Comma-separated</span>              
              </div>              
              <input type="text" id="event-hosts" required placeholder="e.g., Alex, Jordan, Sam"                
                class="w-full bg-discord-darkest border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">            
              <div id="hosts-tag-preview" class="flex flex-wrap gap-1.5 mt-2.5 min-h-[24px]"></div>            
            </div>            
            <div>              
              <div class="flex items-center justify-between mb-1.5">                
                <label class="block text-xs font-semibold uppercase tracking-wider text-purple-400">                  
                  Co-Hosts                
                </label>                
                <span class="text-[11px] text-gray-500">Optional</span>              
              </div>              
              <input type="text" id="event-cohosts" placeholder="e.g., Taylor, Morgan"                
                class="w-full bg-discord-darkest border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all">            
              <div id="cohosts-tag-preview" class="flex flex-wrap gap-1.5 mt-2.5 min-h-[24px]"></div>            
            </div>            
            <div>              
              <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">                
                Initial Status              
              </label>              
              <select id="event-status" class="w-full bg-discord-darkest border border-gray-700/80 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-discord-blurple">                
                <option value="Upcoming">🗓️ Upcoming</option>                
                <option value="Live Now">🔴 Live Now</option>                
                <option value="Draft">📝 Draft</option>              
              </select>            
            </div>            
            <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-discord-blurple to-indigo-600 hover:from-indigo-600 hover:to-discord-blurple text-white font-semibold rounded-xl shadow-lg shadow-discord-blurple/25 hover:shadow-discord-blurple/40 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">              
              <i class="fa-solid">📌</i>              
              <span>Create Event</span>            
            </button>          
          </form>        
        </div>        
        <div class="glass-card rounded-2xl p-5 shadow-lg flex items-center justify-between">          
          <div class="flex items-center space-x-3">            
            <div class="w-10 h-10 rounded-xl bg-gray-800 flex items-center justify-center text-discord-blurple text-lg">📊</div>            
            <div>              
              <div class="text-xs text-gray-400 font-medium">Total Saved Events</div>              
              <div id="stats-total-events" class="text-lg font-bold text-white">0</div>            
            </div>          
          </div>          
          <button id="clear-all-events-btn" class="text-xs text-gray-500 hover:text-discord-red transition-colors px-2 py-1 rounded hover:bg-discord-red/10">            
            Clear All          
          </button>        
        </div>      
      </section>

      <section class="lg:col-span-7 flex flex-col space-y-6">        
        <div class="glass-card rounded-2xl p-4 shadow-lg flex flex-col sm:flex-row items-center justify-between gap-4">          
          <div class="relative w-full sm:w-64">            
            <input type="text" id="search-events" placeholder="Search events or hosts..."              
              class="w-full bg-discord-darkest border border-gray-700/80 rounded-xl pl-9 pr-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-discord-blurple">            
            <i class="fa-solid text-gray-500 absolute left-3 top-3 text-xs">🔍</i>          
          </div>          
          <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">            
            <span class="text-xs text-gray-400 hidden sm:inline">Filter:</span>            
            <button data-filter="all" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-discord-blurple text-white transition-all">All</button>            
            <button data-filter="Upcoming" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-discord-darker hover:bg-gray-700 text-gray-300 transition-all">Upcoming</button>            
            <button data-filter="Live Now" class="filter-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-discord-darker hover:bg-gray-700 text-gray-300 transition-all">Live</button>          
          </div>        
        </div>        
        <div id="events-list" class="space-y-4"></div>        
        <div id="empty-state" class="hidden glass-card rounded-2xl p-12 text-center flex flex-col items-center justify-center space-y-3">          
          <div class="w-16 h-16 rounded-full bg-discord-darker flex items-center justify-center text-3xl text-gray-600 mb-2">🏷️</div>          
          <h3 class="text-base font-bold text-gray-300">No events found</h3>          
          <p class="text-xs text-gray-500 max-w-sm">            
            Schedule an event using the form on the left, or try adjusting your search filters.          
          </p>        
        </div>      
      </section>    
    </main>  
  </div>

  <!-- Date/Time Selection Modal -->
  <div id="upcoming-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50">  
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-sm shadow-xl text-white">    
      <h3 class="text-lg font-bold mb-3">Schedule Upcoming Event</h3>        
      <label class="block text-xs text-slate-400 mb-1">Select Date & Time</label>    
      <input type="datetime-local" id="upcoming-datetime" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500 mb-4">    
      <div class="flex justify-end gap-2">      
        <button onclick="closeUpcomingModal()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">Cancel</button>      
        <button onclick="confirmUpcomingDate()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 rounded text-xs font-semibold">Confirm Time</button>    
      </div>  
    </div>
  </div>

  <script>    
    const STORAGE_KEY_EVENTS = 'she_discord_events_v1';    
    const STORAGE_KEY_CFG = 'she_discord_cfg_v1';    
    const STORAGE_KEY_USER = 'she_discord_user_v1';    
    
    let pendingEventData = null;

    let state = {      
      events: [],      
      filter: 'all',      
      searchQuery: '',      
      currentUser: null,      
      config: {        
        clientId: '1551275171640508436',        
        redirectUri: window.location.href.split('#')[0],        
        mockMode: false      
      }    
    };    

    window.addEventListener('DOMContentLoaded', () => {      
      loadLocalStorage();      
      handleOAuthCallback();      
      initEventListeners();      
      renderApp();    
    });    

    function loadLocalStorage() {      
      const savedCfg = localStorage.getItem(STORAGE_KEY_CFG);      
      if (savedCfg) {        
        try { state.config = { ...state.config, ...JSON.parse(savedCfg) }; } catch(e){}      
      }      
      const savedUser = localStorage.getItem(STORAGE_KEY_USER);      
      if (savedUser) {        
        try { state.currentUser = JSON.parse(savedUser); } catch(e){}      
      }      
      const savedEvents = localStorage.getItem(STORAGE_KEY_EVENTS);      
      if (savedEvents) {        
        try { state.events = JSON.parse(savedEvents); } catch(e){}      
      } else {        
        state.events = [          
          {            
            id: 'evt-' + Date.now(),            
            title: 'Weekly Community Game Night',            
            hosts: ['AlexAdmin', 'DiscordMod'],            
            cohosts: ['CommunityHost'],            
            status: 'Upcoming',            
            timestamp: new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })          
          }        
        ];        
        saveEvents();      
      }    
    }    

    function saveEvents() {      
      localStorage.setItem(STORAGE_KEY_EVENTS, JSON.stringify(state.events));    
    }    

    function handleOAuthCallback() {      
      const hash = window.location.hash.substring(1);      
      if (hash) {        
        const params = new URLSearchParams(hash);        
        const accessToken = params.get('access_token');        
        if (accessToken) {          
          fetch('https://discord.com/api/users/@me', {            
            headers: { authorization: `Bearer ${accessToken}` }          
          })          
          .then(res => res.json())          
          .then(userData => {            
            if (userData.username) {              
              const avatarUrl = userData.avatar                 
                ? `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png`                
                : 'https://cdn.discordapp.com/embed/avatars/0.png';  
              state.currentUser = { id: userData.id, username: userData.username, avatar: avatarUrl }; 
              saveUser(); 
              autoFillHostName();
            }          
          })          
          .catch(err => console.error('OAuth User Info Error:', err))          
          .finally(() => {            
            history.pushState("", document.title, window.location.pathname + window.location.search);            
            renderApp();          
          });        
        }      
      }    
    }    

    function renderApp() {      
      renderEventsList();      
      renderStats();    
    }    

    function renderEventsList() {      
      const listEl = document.getElementById('events-list');      
      const emptyStateEl = document.getElementById('empty-state');      
      if (!listEl) return;      
      
      const filtered = state.events.filter(evt => {        
        const matchesFilter = state.filter === 'all' || evt.status === state.filter;        
        const q = state.searchQuery.toLowerCase();        
        const matchesSearch = !q ||           
          evt.title.toLowerCase().includes(q) ||          
          evt.hosts.some(h => h.toLowerCase().includes(q)) ||          
          evt.cohosts.some(c => c.toLowerCase().includes(q));        
        return matchesFilter && matchesSearch;      
      });      

      if (filtered.length === 0) {        
        listEl.innerHTML = '';        
        emptyStateEl?.classList.remove('hidden');        
        return;      
      }      

      emptyStateEl?.classList.add('hidden');      
      listEl.innerHTML = filtered.map(evt => {        
        const statusColors = {          
          'Upcoming': 'bg-blue-500/20 text-blue-400 border-blue-500/30',          
          'Live Now': 'bg-discord-red/20 text-discord-red border-discord-red/30 animate-pulse',          
          'Draft': 'bg-gray-700/50 text-gray-400 border-gray-600/40'        
        }[evt.status] || 'bg-gray-700/50 text-gray-300 border-gray-600/40';        
        
        return `          
          <div class="glass-card rounded-2xl p-5 hover:border-gray-700 transition-all flex flex-col md:flex-row md:items-center justify-between gap-4 shadow-lg group">                        
            <div class="space-y-2 flex-1">              
              <div class="flex flex-wrap items-center gap-2">                
                <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full border ${statusColors}">${evt.status}</span>                
                <span class="text-xs text-gray-500 font-mono">🕒 ${evt.timestamp}</span>              
              </div>              
              <h3 class="text-base font-bold text-white group-hover:text-discord-blurple transition-colors">${escapeHtml(evt.title)}</h3>              
              <div class="flex flex-wrap gap-2 pt-1">                
                ${evt.hosts.map(h => `                  
                  <span class="inline-flex items-center text-xs font-medium px-2.5 py-1 rounded-lg bg-blue-600/20 text-blue-300 border border-blue-500/30">                    
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-400 mr-1.5"></span>Host: ${escapeHtml(h)}                  
                  </span>`).join('')}                
                ${evt.cohosts.map(c => `                  
                  <span class="inline-flex items-center text-xs font-medium px-2.5 py-1 rounded-lg bg-purple-600/20 text-purple-300 border border-purple-500/30">                    
                    <span class="w-1.5 h-1.5 rounded-full bg-purple-400 mr-1.5"></span>Co-Host: ${escapeHtml(c)}                  
                  </span>`).join('')}              
              </div>            
            </div>            
            <div class="flex items-center space-x-2 justify-end border-t border-gray-800/80 pt-3 md:pt-0 md:border-0">              
              <button onclick="deleteEvent('${evt.id}')" class="p-2 text-gray-500 hover:text-discord-red hover:bg-discord-red/10 rounded-xl transition-all" title="Delete Event">🗑️</button>            
            </div>          
          </div>`;      
      }).join('');    
    }    

    function renderStats() {      
      const statsEl = document.getElementById('stats-total-events');      
      if (statsEl) {        
        statsEl.textContent = state.events.length;      
      }    
    }    

    function parseCommaSeparatedTags(inputVal) {      
      if (!inputVal) return [];      
      return inputVal.split(',')        
        .map(tag => tag.trim())        
        .filter(tag => tag.length > 0);    
    }    

    function renderTagPreviews() {      
      const hostsVal = document.getElementById('event-hosts').value;      
      const cohostsVal = document.getElementById('event-cohosts').value;      
      const hostTags = parseCommaSeparatedTags(hostsVal);      
      const cohostTags = parseCommaSeparatedTags(cohostsVal);      
      const hostPreviewContainer = document.getElementById('hosts-tag-preview');      
      const cohostPreviewContainer = document.getElementById('cohosts-tag-preview');      
      
      if (hostPreviewContainer) {        
        hostPreviewContainer.innerHTML = hostTags.map(tag => `          
          <span class="text-xs font-medium px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-300 border border-blue-500/30">            
            ${escapeHtml(tag)}          
          </span>`).join('');      
      }      
      if (cohostPreviewContainer) {        
        cohostPreviewContainer.innerHTML = cohostTags.map(tag => `          
          <span class="text-xs font-medium px-2 py-0.5 rounded-md bg-purple-500/20 text-purple-300 border border-purple-500/30">            
            ${escapeHtml(tag)}          
          </span>`).join('');      
      }    
    }    

    function createAndSaveEvent(eventData) {
      state.events.unshift(eventData);
      saveEvents();
      renderApp();
      document.getElementById('event-form').reset();
      renderTagPreviews();
    }

    function initEventListeners() {      
      document.getElementById('event-hosts')?.addEventListener('input', renderTagPreviews);      
      document.getElementById('event-cohosts')?.addEventListener('input', renderTagPreviews);      
      
      document.getElementById('event-form')?.addEventListener('submit', (e) => {        
        e.preventDefault();        
        const title = document.getElementById('event-title').value.trim();        
        const hostsRaw = document.getElementById('event-hosts').value;        
        const cohostsRaw = document.getElementById('event-cohosts').value;        
        const status = document.getElementById('event-status').value;        
        const hosts = parseCommaSeparatedTags(hostsRaw);        
        const cohosts = parseCommaSeparatedTags(cohostsRaw);        
        if (!title || hosts.length === 0) return;        
        
        const newEvt = {          
          id: 'evt-' + Date.now(),          
          title,          
          hosts,          
          cohosts,          
          status,          
          timestamp: new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })        
        };        

        if (status === 'Upcoming') {
          pendingEventData = newEvt;
          document.getElementById('upcoming-modal').classList.remove('hidden');
        } else {
          createAndSaveEvent(newEvt);
        }
      });      

      document.getElementById('search-events')?.addEventListener('input', (e) => {        
        state.searchQuery = e.target.value;        
        renderEventsList();      
      });      

      document.querySelectorAll('.filter-btn').forEach(btn => {        
        btn.addEventListener('click', (e) => {          
          document.querySelectorAll('.filter-btn').forEach(b => {            
            b.classList.remove('bg-discord-blurple', 'text-white');            
            b.classList.add('bg-discord-darker', 'text-gray-300');          
          });          
          e.target.classList.remove('bg-discord-darker', 'text-gray-300');          
          e.target.classList.add('bg-discord-blurple', 'text-white');          
          state.filter = e.target.getAttribute('data-filter');          
          renderEventsList();        
        });      
      });      

      document.getElementById('clear-all-events-btn')?.addEventListener('click', () => {        
        if (state.events.length === 0) return;        
        state.events = [];        
        saveEvents();        
        renderApp();      
      });      
    }    

    window.closeUpcomingModal = function() {
      document.getElementById('upcoming-modal').classList.add('hidden');
      pendingEventData = null;
    };

    window.confirmUpcomingDate = function() {
      const dateTimeVal = document.getElementById('upcoming-datetime').value;
      if (pendingEventData) {
        if (dateTimeVal) {
          const selectedDate = new Date(dateTimeVal);
          pendingEventData.timestamp = selectedDate.toLocaleString([], { 
            month: 'short', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit' 
          });
        }
        createAndSaveEvent(pendingEventData);
      }
      closeUpcomingModal();
    };

    window.deleteEvent = function(id) {      
      state.events = state.events.filter(e => e.id !== id);      
      saveEvents();      
      renderApp();    
    };    

    function escapeHtml(str) {      
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");    
    }  
  </script>
</body>
</html>
